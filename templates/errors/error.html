<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#104c3d">
  <title>{{ code }} — {{ heading }}</title>
  <style>
    :root{color-scheme:light;--green:#104c3d;--green2:#24704d;--ink:#1d2d25;--muted:#5c6d63;--line:#dce5de;--paper:#fff;--bg:#f3f6f2}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#edf5ef,var(--bg) 52%,#e9f0eb);color:var(--ink);font:16px/1.55 Inter,"Segoe UI",Arial,sans-serif}
    main{width:min(100%,600px);padding:clamp(26px,6vw,48px);background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 55px #14362912}
    .brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:34px;color:var(--green);font-size:14px;font-weight:800;letter-spacing:.12em;text-decoration:none}.brand-mark{display:grid;width:34px;height:34px;place-items:center;border-radius:10px;background:var(--green);color:#fff;font-size:15px;letter-spacing:0}
    .code{margin:0 0 8px;color:var(--green2);font-size:13px;font-weight:800;letter-spacing:.16em}h1{margin:0 0 12px;font-size:clamp(25px,5vw,34px);line-height:1.18;letter-spacing:-.02em}p{margin:0;color:var(--muted);max-width:48ch}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.button{display:inline-flex;min-height:46px;align-items:center;justify-content:center;padding:11px 18px;border:1px solid var(--green);border-radius:10px;background:var(--green);color:white;font-weight:700;text-decoration:none}.button:hover{background:#0b3c30}.help{margin-top:25px;padding-top:17px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
    @media(max-width:480px){body{padding:14px}main{border-radius:15px}.actions .button{width:100%}}
  </style>
</head>
<body>
  <main role="main">
    <a class="brand" href="/" aria-label="D10 Agro — início"><span class="brand-mark" aria-hidden="true">D10</span><span>D10 AGRO</span></a>
    <p class="code">ERRO {{ code }}</p>
    <h1>{{ heading }}</h1>
    <p>{{ message }}</p>
    <div class="actions"><a class="button" href="/">Voltar ao início</a></div>
    <p class="help">Se precisar de ajuda, entre em contato com o responsável pelo sistema.</p>
  </main>
</body>
</html>
